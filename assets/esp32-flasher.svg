<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Firmware Flasher</title>
  <desc id="desc">A stylized flow from a firmware bundle through an ESP32 chip to a successful flashing progress panel.</desc>
  <defs>
    <style>
      .flow { stroke-dasharray: 8 10; animation: flow 4s linear infinite; }
      .led { animation: led 2.2s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset:-108; } }
      @keyframes led { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .flow,.led { animation:none !important; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#083247"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7dd3fc" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="600" height="260" rx="18" fill="url(#bg)"/>
  <rect width="600" height="260" rx="18" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="28" y="38" fill="#f8fafc" font-size="17" font-weight="700" letter-spacing="1.4">ESP32 · FIRMWARE FLASHER</text>
    <text x="28" y="61" fill="#94a3b8" font-size="12">Detect package → connect device → flash safely</text>
  </g>

  <g transform="translate(38 94)">
    <path d="M0 12a12 12 0 0 1 12-12h50l22 22v76a12 12 0 0 1-12 12H12A12 12 0 0 1 0 98Z" fill="#0d263d" stroke="#38bdf8" stroke-opacity=".68" stroke-width="2"/>
    <path d="M62 0v22h22" fill="none" stroke="#38bdf8" stroke-opacity=".68" stroke-width="2"/>
    <path d="M18 47h47M18 65h38M18 83h30" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    <text x="42" y="132" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">ZIP / BIN</text>
  </g>

  <path class="flow" d="M139 149H220M360 149H435" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path d="m209 142 11 7-11 7M424 142l11 7-11 7" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(220 87)">
    <rect width="140" height="124" rx="18" fill="#0d263d" stroke="#2dd4bf" stroke-opacity=".72" stroke-width="2"/>
    <rect x="35" y="27" width="70" height="70" rx="10" fill="#071827" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M49 43h42M49 56h42M49 69h30" stroke="#99f6e4" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 39h17M18 55h17M18 71h17M105 39h17M105 55h17M105 71h17" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="2"/>
    <circle class="led" cx="111" cy="106" r="5" fill="#a3e635"/>
    <text x="70" y="145" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">AUTO DETECT</text>
  </g>

  <g transform="translate(435 90)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="132" height="118" rx="16" fill="#0d263d" stroke="#a3e635" stroke-opacity=".64" stroke-width="2"/>
    <circle cx="24" cy="27" r="5" fill="#a3e635"/>
    <text x="38" y="32" fill="#d9f99d" font-size="12" font-weight="700">CONNECTED</text>
    <rect x="18" y="52" width="96" height="12" rx="6" fill="#071827"/>
    <rect x="18" y="52" width="96" height="12" rx="6" fill="url(#accent)"/>
    <text x="18" y="86" fill="#f8fafc" font-size="18" font-weight="700">100%</text>
    <text x="18" y="105" fill="#94a3b8" font-size="11">FLASH COMPLETE</text>
  </g>
  <rect x="1" y="1" width="598" height="258" rx="17" fill="none" stroke="#7dd3fc" stroke-opacity=".16" stroke-width="2"/>
</svg>
