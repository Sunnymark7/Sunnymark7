<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Sunnymark7 profile header</title>
  <desc id="desc">A dark technical banner for intelligent systems and interactive hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="90" r="270" fill="url(#glow)"/>
  <circle cx="130" cy="310" r="240" fill="url(#glow)" opacity="0.55"/>

  <g transform="translate(875 52)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 204V110M85 130L48 92M85 150L126 101M85 174L146 152M85 192L43 183" stroke="#bae6fd" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M48 92L31 54M126 101L143 59M146 152L189 137M43 183L14 207" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M85 204C74 226 51 234 37 218C25 205 32 190 43 183M85 204C98 227 127 232 145 213C157 200 153 177 146 152" stroke="#e0f2fe" stroke-opacity="0.4" stroke-width="2"/>
    <g fill="#07111f" stroke-width="3" filter="url(#softGlow)">
      <circle cx="85" cy="110" r="6" stroke="#38bdf8"/>
      <circle cx="48" cy="92" r="6" stroke="#2dd4bf"/>
      <circle cx="31" cy="54" r="6" stroke="#a3e635"/>
      <circle cx="126" cy="101" r="6" stroke="#2dd4bf"/>
      <circle cx="143" cy="59" r="6" stroke="#a3e635"/>
      <circle cx="146" cy="152" r="6" stroke="#38bdf8"/>
      <circle cx="189" cy="137" r="6" stroke="#a3e635"/>
      <circle cx="43" cy="183" r="6" stroke="#38bdf8"/>
      <circle cx="14" cy="207" r="6" stroke="#a3e635"/>
      <circle cx="85" cy="204" r="7" stroke="#2dd4bf"/>
    </g>
  </g>

  <g transform="translate(78 82)">
    <rect x="0" y="0" width="56" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="70" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="4">SUNNYMARK7</text>
    <text x="2" y="116" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="1.2">INTELLIGENT SYSTEMS · INTERACTIVE HARDWARE</text>
    <text x="2" y="164" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="2.4">SENSORS  /  BCI  /  EMBEDDED  /  3D</text>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="2"/>
</svg>
