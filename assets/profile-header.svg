<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Sunnymark7 — intelligent systems and interactive hardware</title>
  <desc id="desc">A compact navy technical banner with a flowing signal line and a tactile hand constellation.</desc>
  <defs>
    <style>
      .flow { stroke-dasharray: 12 16; animation: flow 5s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
      .pulse-b { animation-delay: .9s; }
      .pulse-c { animation-delay: 1.8s; }
      @keyframes flow { to { stroke-dashoffset: -168; } }
      @keyframes pulse {
        0%, 100% { opacity: .48; transform: scale(.82); }
        50% { opacity: 1; transform: scale(1.28); }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none !important; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset=".55" stop-color="#0b2239"/>
      <stop offset="1" stop-color="#07324a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".23"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="26" fill="url(#grid)"/>
  <circle cx="1040" cy="74" r="235" fill="url(#halo)"/>
  <circle cx="160" cy="276" r="190" fill="url(#halo)" opacity=".42"/>

  <path class="flow" d="M0 225C150 181 270 247 425 211S712 184 842 214S1064 237 1200 192" fill="none" stroke="url(#accent)" stroke-opacity=".34" stroke-width="2.5"/>
  <circle class="pulse" cx="425" cy="211" r="5" fill="#38bdf8"/>
  <circle class="pulse pulse-b" cx="842" cy="214" r="5" fill="#2dd4bf"/>
  <circle class="pulse pulse-c" cx="1096" cy="214" r="5" fill="#a3e635"/>

  <g transform="translate(78 54)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="66" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="69" fill="#f8fafc" font-size="52" font-weight="750" letter-spacing="4">SUNNYMARK7</text>
    <text x="2" y="111" fill="#bae6fd" font-size="22" font-weight="550" letter-spacing="1.1">INTELLIGENT SYSTEMS · INTERACTIVE HARDWARE</text>
    <text x="2" y="151" fill="#94a3b8" font-size="16" font-weight="600" letter-spacing="2">SENSE  →  ACQUIRE  →  UNDERSTAND  →  INTERACT</text>
  </g>

  <g transform="translate(930 32)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 188V100M82 119L46 82M82 138L121 89M82 159L140 139M82 176L42 169" stroke="#bae6fd" stroke-opacity=".52" stroke-width="2.2"/>
    <path d="M46 82L30 48M121 89L136 51M140 139L179 126M42 169L17 190" stroke="#5eead4" stroke-opacity=".63" stroke-width="2.2"/>
    <path d="M82 188C69 208 49 213 35 198C25 187 31 174 42 169M82 188C96 208 121 211 137 195C149 183 147 159 140 139" stroke="#e0f2fe" stroke-opacity=".42" stroke-width="2.2"/>
    <g fill="#07111f" stroke-width="3" filter="url(#glow)">
      <circle cx="82" cy="100" r="6" stroke="#38bdf8"/>
      <circle cx="46" cy="82" r="6" stroke="#2dd4bf"/>
      <circle class="pulse" cx="30" cy="48" r="6" stroke="#a3e635"/>
      <circle cx="121" cy="89" r="6" stroke="#2dd4bf"/>
      <circle class="pulse pulse-b" cx="136" cy="51" r="6" stroke="#a3e635"/>
      <circle cx="140" cy="139" r="6" stroke="#38bdf8"/>
      <circle class="pulse pulse-c" cx="179" cy="126" r="6" stroke="#a3e635"/>
      <circle cx="42" cy="169" r="6" stroke="#38bdf8"/>
      <circle cx="17" cy="190" r="6" stroke="#a3e635"/>
      <circle cx="82" cy="188" r="7" stroke="#2dd4bf"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="25" fill="none" stroke="#7dd3fc" stroke-opacity=".18" stroke-width="2"/>
</svg>
